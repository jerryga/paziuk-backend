steps:
# ... (your existing build steps, e.g., building the Docker image)
- name: 'gcr.io/cloud-builders/docker'
  args: ['build', '-t', 'gcr.io/$PROJECT_ID/my-image', '.']

- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: gcloud
  args:
  - 'run'
  - 'deploy'
  - 'familytree-backend' # Your Cloud Run service name
  - '--image'
  - 'gcr.io/$PROJECT_ID/my-image' # Or the full Artifact Registry path
  - '--platform'
  - 'managed'
  - '--region'
  - 'us-central1' # Your desired region
  - '--allow-unauthenticated' # Or configure authentication as needed

options:
  logging: CLOUD_LOGGING_ONLY
